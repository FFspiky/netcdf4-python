name: PR 1525 native diagnostic (fork only)
on:
  push:
    branches: [ci/1525-sidecar-20261112]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'FFspiky/netcdf4-python'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: TEST
          init-shell: bash
          create-args: >-
            python=3.12.16
            openmpi=5.0.11=hee33aa4_0
            ucx=1.22.0=h6cc3e34_1
            hdf5=2.2.0=mpi_openmpi_h0b8148c_1
            libnetcdf=4.10.0=mpi_openmpi_h75687c8_4
            --channel conda-forge
      - name: Independent native probes (no Python extension)
        run: |
          micromamba list
          nc-config --all
          python .github/ci-sidecar/probe.py
